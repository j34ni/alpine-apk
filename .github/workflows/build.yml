name: build-and-publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore signing key
        env:
          KEY_B64: ${{ secrets.ABUILD_PRIVKEY_B64 }}
        run: |
          mkdir -p keys-runner
          PUB=$(basename keys/*.rsa.pub)
          printf '%s' "$KEY_B64" | base64 -d > "keys-runner/${PUB%.pub}"
          cp "keys/$PUB" "keys-runner/$PUB"

      - name: Cache distfiles
        uses: actions/cache@v4
        with:
          path: .distfiles
          key: distfiles-${{ hashFiles('j34ni/*/APKBUILD') }}

      - name: Restore published artifacts (incremental)
        run: |
          BASE=https://j34ni.github.io/alpine-apk/edge/j34ni
          mkdir -p out/j34ni/x86_64
          if curl -fsSL "$BASE/built-manifest.txt" -o out/built-manifest.txt; then
            curl -fsSL "$BASE/x86_64/APKINDEX.tar.gz" -o "out/j34ni/x86_64/APKINDEX.tar.gz" || echo "miss APKINDEX"
            cut -d' ' -f3- out/built-manifest.txt | tr ',' '\n' | grep '\.apk$' | sort -u | while read -r a; do
              curl -fsSL "$BASE/x86_64/$a" -o "out/j34ni/x86_64/$a" || echo "miss $a (will rebuild)"
            done
            echo "restored $(ls out/j34ni/x86_64/*.apk 2>/dev/null | wc -l) apks"
          else
            echo "no published manifest: full build"
          fi

      - name: Build all packages (alpine:edge, abuild)
        run: |
          mkdir -p .distfiles
          docker run --rm \
            -e WS=/ws -e KEYS=/keys -e CACHE=/cache \
            -v "$PWD:/ws" -v "$PWD/keys-runner:/keys" -v "$PWD/.distfiles:/cache" \
            alpine:edge sh /ws/scripts/build.sh

      - name: Assemble Pages site
        run: |
          mkdir -p dist/edge dist/keys
          cp -r out/j34ni dist/edge/j34ni
          cp out/built-manifest.txt dist/edge/j34ni/built-manifest.txt
          cp keys/*.rsa.pub dist/keys/
          KEY=$(basename keys/*.rsa.pub)
          {
            echo '<!doctype html><meta charset="utf-8"><title>j34ni alpine repo</title>'
            echo '<h1>alpine-apk (edge/x86_64)</h1>'
            echo "<p>Install: <code>wget -O /etc/apk/keys/$KEY https://j34ni.github.io/alpine-apk/keys/$KEY</code> then <code>echo https://j34ni.github.io/alpine-apk/edge/j34ni >> /etc/apk/repositories && apk update</code></p>"
            echo '<ul>'
            for f in dist/edge/j34ni/x86_64/*.apk; do
              echo "<li><a href=\"edge/j34ni/x86_64/$(basename "$f")\">$(basename "$f")</a></li>"
            done
            echo '</ul>'
            echo "<p>Signing key: <a href=\"keys/$KEY\">$KEY</a></p>"
          } > dist/index.html
          {
            echo '<!doctype html><meta charset="utf-8"><title>j34ni apks edge/x86_64</title>'
            echo '<h1>Prebuilt apks (edge/x86_64)</h1><ul>'
            for f in dist/edge/j34ni/x86_64/*.apk; do
              echo "<li><a href=\"./$(basename "$f")\">$(basename "$f")</a></li>"
            done
            echo '</ul><p><a href="../../../index.html">back</a></p>'
          } > dist/edge/j34ni/x86_64/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
